baseURL: https://zone.photos
title: Zone Photos # todo: change site name.
defaultContentLanguage: 'en'
theme: eternity
googleAnalytics: ''
enableRobotsTXT: true
minify:
  minifyOutput: true

params:
  sitename: Zone Photos
  googleAnalyticsId: 'G-GBLD7612EJ'
  image: /images/banner.png
  subtitle: "Fine art photography, authored portraits, and black and white street photography from The Hague, The Netherlands."
  description: "Zone Photos is the portfolio of Thomas T. Cremers, a fine art photographer in The Hague working with authored portraiture, black and white street photography, and conceptual photo art."
  copyright: All rights reserved.
  author: Thomas T. Cremers
  dontShowSource: false # please, do not do this :)
  portfolio:
    columns:
      desktop:
        archive: 6
        default: 2
      mobile:
        default: 2
        phart: 1
  socials:
    # todo: change these links.
    - icon: 'fa-brands fa-facebook fa-lg'
      url: 'https://www.facebook.com/theodoorthomas'
      landing: true
    - icon: 'fab fa-instagram fa-lg'
      url: 'https://instagram.com/theodoorthomas_photo_art'
      landing: true
  homepage: "/tags/life-in-contrast/" # homepage link, mostly same with menu.main[0]
  specialPages:
    - work
    - archive
  bypassWelcomePage: false # redirects "/" to "homepage" when it's true.
  disableWelcomePageBackground: true # disables the background image on the homepage
  plausible: '' # todo: set your plausible id.
  disableRadius: true
  moveIt: false  # Moves Title and Meta info down, only visible when scroll.
  disableAlwaysResize: true

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  tag: tags
  category: categories

permalinks:
  work: ":contentbasename/"

